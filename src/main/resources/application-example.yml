server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

# Spring AI Alibaba DashScope 配置
spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}  # 从环境变量读取或使用默认值
      chat:
        options:
          timeout: 180000  # 超时时间180秒（3分钟）
      retry:
        max-attempts: 3  # 最大重试次数
        backoff:
          initial-interval: 2000  # 初始重试间隔2秒
          multiplier: 2  # 重试间隔倍数
          max-interval: 10000  # 最大重试间隔10秒
    
    # Spring AI MCP 客户端配置
    # 如果使用mock数据，请注释这部分内容
    mcp:
      client:
        enabled: true
        name: tencent-mcp-server
        version: 1.1.0
        request-timeout: 60s
        type: ASYNC
        sse:
          connections:
            tencent-cls:
              url: https://mcp-api.tencent-cloud.com
              sse-endpoint: /sse/92XXXXXXXXb4  # 完整的SSE端点路径

# 阿里云 DashScope Embedding API 配置
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:your-api-key-here}  # 从环境变量读取或使用默认值（用于自定义配置）
  embedding:
    model: text-embedding-v4  # 阿里云文本向量化模型

# 文档分片配置
document:
  chunk:
    max-size: 800  # 每个分片最大字符数
    overlap: 100   # 分片之间的重叠字符数

# RAG 配置
rag:
  top-k: 3  # 检索返回的最相似文档数量
  model: "qwen3-max"  # 大语言模型名称
  postgres:
    jdbc-url: jdbc:postgresql://localhost:5432/leap_agent
    username: leap
    password: leap
    init-schema: true
    chunk-table-name: rag_document_chunk
  elasticsearch:
    enabled: true
    base-url: http://localhost:9200
    index-name: leap_rag_chunks
    timeout-millis: 5000
  knowledge-graph:
    enabled: true
    uri: bolt://localhost:7687
    username: neo4j
    password: leap
    init-schema: true
    max-hops: 2
    weight: 1.0  # 权重系数
    fetch-multiplier: 2   # 图谱预取放大系数：最终只取TopN结果，但先多拉 2*N 条候选，过滤降噪后再参与RRF排序，提升召回上限
    rrf-k: 60   # RRF 倒数融合算法的平滑常量 k，用来避免排名靠前文档分数爆炸，业界常用取值 50~60
    async-index-enabled: true

# 记忆模块配置
memory:
  short-term:
    max-window-size: 6
  preference:
    storage-path: ./data/preferences.json
    async-llm-enabled: true
  long-term:
    repository: postgres
    storage-path: ./data/long-term-memory.json
    postgres:
      jdbc-url: jdbc:postgresql://localhost:5432/leap_agent
      username: leap
      password: leap
      init-schema: true     # 自动初始化 检查数据表是否存在，无需手动建表 SQL
      table-name: long_term_memory
    graph:
      enabled: true
      uri: bolt://localhost:7687
      username: neo4j
      password: leap
      init-schema: true
      similarity-edge-threshold: 0.80  # 新记忆和近期记忆超过该相似度时建立 SIMILAR_TO
      similar-scan-limit: 50           # 新增记忆时向前扫描多少条 active 记忆
      neighbor-hops: 1                 # 召回 seed 通过图扩展的跳数
      centrality-protect-in-degree: 3  # 入度达到该值时，TTL 淘汰会保护该记忆
      graph-expanded-score: 0.45       # 图扩展命中的兜底召回分数
    async-extraction-enabled: true
    async-llm-enabled: true
    prompt-top-k: 4
    min-recall-score: 0.42      # 召回门槛
    min-confidence: 0.7         # 记忆入库准入门槛
    dedup-threshold: 0.92       # 记忆入库查重阈值
    similarity-threshold: 0.80  # 记忆合并阈值
    ttl-days: 30                # 记忆最大存活生命周期
    decay-rate: 0.995           # 记忆重要性衰减系数 定期执行衰减任务：importance = importance * 0.995。
    min-importance: 0.30        # 记忆最低重要性底线：当记忆重要度衰减到 ≤ 0.30，这条记忆会被清理删除，不再保留。
    consolidation-trigger-interval: 5   # 记忆合并触发周期

# Prometheus 配置
prometheus:
  base-url: http://localhost:9090
  timeout: 10  # 超时时间（秒）
  mock-enabled: false  # 是否启用 Mock 模式（用于测试）

# CLS 云日志服务配置
cls:
  mock-enabled: false  # 是否启用 Mock 模式（用于测试，设为 true 返回与告警关联的模拟日志数据）
